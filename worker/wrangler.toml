# ランキングの置き場（Cloudflare Workers + KV）
#
#   npx wrangler kv namespace create SCORES   # 出てきた id を下に貼る
#   npx wrangler deploy
#
# 出ると https://stopwatch10-rank.<アカウント>.workers.dev になる。
# その URL を index.html の <meta name="stopwatch10-api"> に入れる。
#
name = "stopwatch10-rank"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 一つのログインで複数のアカウントを扱っている場合、どれに置くか聞かれる。
# 迷わせたくなければ、置きたいアカウントの ID を書いておく
# （Cloudflare のダッシュボード右下、または npx wrangler whoami で分かる）。
# account_id = ""

# npx wrangler kv namespace create SCORES で作ったもの（2026-09-11）
[[kv_namespaces]]
binding = "SCORES"
id = "97753a2e4aa6404780fb5f2c577fff50"

# 誰でも書き込めるランキングなので、置き場所を絞る。
# 空にすると全部のサイトから受ける。
[vars]
ALLOW_ORIGINS = "https://koshinstudio.com,https://stopwatch10.pages.dev"
